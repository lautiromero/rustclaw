[package]
name = "lite-agent"
version = "0.1.0"
edition = "2024"
description = "A lightweight agent with a rig, controlled embeddings, and extensible tools"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
comfy-table = "7.2.2"
crossterm = "0.29.0"
dotenvy = "0.15.7"
duct = "1.1.1"
hex = "0.4.3"
html2text = "0.17.1"
indicatif = "0.18.4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.1"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
rig-core = "0.36.0"
rig-derive = "0.1.13"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
